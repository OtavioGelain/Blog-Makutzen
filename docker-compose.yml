services: 
  postgres:
    image: postgres:15
    container_name: blog-makutzen-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: kanban
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: blog-makutzen-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: