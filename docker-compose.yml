
services:
  app:
    build: .
    container_name: blog-makutzen-app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://postgres:1234@postgres:5432/kanban
      REDIS_HOST: redis
    volumes:
      - .:/app:Z
      - /app/node_modules

  postgres:
    image: postgres:15
    container_name: blog-makutzen-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: kanban
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: blog-makutzen-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: